name: API CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'prisma/**'
      - 'packages/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/jatin34090/storebuilder-api

jobs:
  test:
    name: Test & Type Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jewellery_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jewellery_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/jewellery_test?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      PORT: 3001
      API_URL: http://localhost:3001
      WEB_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY_TEST }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY_TEST }}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      RAZORPAY_KEY_ID: rzp_test_dummy
      RAZORPAY_KEY_SECRET: dummy_secret
      RAZORPAY_WEBHOOK_SECRET: dummy_webhook
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      MSG91_AUTH_KEY: test
      MSG91_TEMPLATE_ID_OTP: test
      MSG91_SENDER_ID: TEST
      RESEND_API_KEY: re_test
      RESEND_FROM_EMAIL: test@test.com
      RESEND_FROM_NAME: Test
      GOOGLE_CLIENT_ID: test.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: test
      GOOGLE_CALLBACK_URL: http://localhost:3001/api/v1/auth/google/callback
      TYPESENSE_HOST: localhost
      TYPESENSE_PORT: "8108"
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: test
      SHIPROCKET_EMAIL: test@test.com
      SHIPROCKET_PASSWORD: test
      SHIPROCKET_PICKUP_PINCODE: "110001"
      DELHIVERY_API_TOKEN: test
      DELHIVERY_CLIENT_NAME: Test
      DELHIVERY_PICKUP_PINCODE: "110001"
      VAPID_PUBLIC_KEY: test
      VAPID_PRIVATE_KEY: test
      VAPID_SUBJECT: mailto:test@test.com
      ADMIN_EMAIL: admin@test.com
      ADMIN_PASSWORD: test_admin_password_16

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @jewellery/types --filter @jewellery/utils build

      - name: Generate Prisma client
        run: pnpm --filter @jewellery/api prisma:generate

      - name: Apply migrations
        run: pnpm --filter @jewellery/api exec prisma migrate deploy --schema=../../prisma/schema.prisma

      - name: Type check
        run: pnpm --filter @jewellery/api typecheck

      - name: Run unit tests
        run: pnpm --filter @jewellery/api exec jest --passWithNoTests

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Run migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/jewellery
            docker run --rm \
              -e DATABASE_URL="${{ secrets.DATABASE_URL_PRODUCTION }}" \
              -e DIRECT_URL="${{ secrets.DIRECT_URL_PRODUCTION }}" \
              ghcr.io/jatin34090/storebuilder-api:${{ github.sha }} \
              node -e "const {execSync}=require('child_process');execSync('npx prisma migrate deploy --schema=./prisma/schema.prisma',{stdio:'inherit'})"

      - name: Deploy API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ~/jewellery
            export API_IMAGE=ghcr.io/jatin34090/storebuilder-api:${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d --no-deps api
            docker image prune -f
