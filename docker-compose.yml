version: '3.9'

# Local development only — matches production versions
# Run: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: jewellery_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jewellery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jewellery_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # Typesense for local search testing
  typesense:
    image: typesense/typesense:0.25.2
    container_name: jewellery_typesense
    restart: unless-stopped
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: local_test_key
    ports:
      - '8108:8108'
    volumes:
      - typesense_data:/data

volumes:
  postgres_data:
  redis_data:
  typesense_data:
