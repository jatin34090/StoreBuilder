# Site server blocks: web (yourdomain.in) + api (api.yourdomain.in).
# Replace server_name and certificate paths for your domain.

# ─── Shared security headers (applied per-location via include) ──────────────
# Kept here as a snippet you can `include`d if preferred.

# ─── HTTP → HTTPS redirect (both hosts) ──────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name yourdomain.in www.yourdomain.in api.yourdomain.in;

  # ACME challenge for Let's Encrypt renewals.
  location /.well-known/acme-challenge/ { root /var/www/certbot; }

  location / { return 301 https://$host$request_uri; }
}

# ─── Web app (Next.js) ───────────────────────────────────────────────────────
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name yourdomain.in www.yourdomain.in;

  ssl_certificate     /etc/letsencrypt/live/yourdomain.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/yourdomain.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_stapling on;
  ssl_stapling_verify on;

  # Security headers
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  limit_conn conn 50;

  # Immutable, long-cache static assets emitted by Next.js.
  location /_next/static/ {
    proxy_pass http://jewellery_web;
    proxy_cache_valid 200 60m;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~* \.(?:ico|png|jpg|jpeg|gif|webp|avif|svg|woff2?)$ {
    proxy_pass http://jewellery_web;
    add_header Cache-Control "public, max-age=2592000";
  }

  location / {
    proxy_pass http://jewellery_web;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 60s;
  }
}

# ─── API (NestJS) ────────────────────────────────────────────────────────────
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.yourdomain.in;

  ssl_certificate     /etc/letsencrypt/live/api.yourdomain.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.in/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;

  # CORS is handled by the API (CORS_ORIGINS) — nginx only forwards origin.
  # Health checks bypass rate limiting and access logs.
  location /api/v1/health {
    proxy_pass http://jewellery_api;
    access_log off;
  }

  # Tighter limit on auth/OTP endpoints.
  location ~ ^/api/v1/auth/(send-otp|verify-otp|login) {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://jewellery_api;
    include /etc/nginx/conf.d/proxy_common.conf;
  }

  location / {
    limit_req zone=api burst=40 nodelay;
    limit_conn conn 50;
    proxy_pass http://jewellery_api;
    include /etc/nginx/conf.d/proxy_common.conf;
  }
}
