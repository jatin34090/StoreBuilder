# Main Nginx config for the jewellery platform reverse proxy.
# Mount at /etc/nginx/nginx.conf. Site server blocks live in conf.d/.

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

events {
  worker_connections  4096;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ─── Logging ───────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                  'urt="$upstream_response_time"';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ─── Performance ───────────────────────────────────────────────────────────
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  server_tokens   off;                 # don't leak the nginx version
  client_max_body_size 12m;            # image uploads (Cloudinary proxy)
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 20s;

  # ─── Compression ───────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    application/javascript application/json application/xml
    application/x-font-ttf font/opentype image/svg+xml
    text/css text/plain text/javascript text/xml;
  # Enable brotli if the module is available (ngx_brotli):
  # brotli on; brotli_comp_level 5; brotli_types ...;

  # ─── WebSocket upgrade map (socket.io delivery tracking) ───────────────────
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ─── Rate limiting zones ───────────────────────────────────────────────────
  limit_req_zone  $binary_remote_addr zone=api:10m   rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=auth:10m  rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;

  # ─── Upstreams ─────────────────────────────────────────────────────────────
  upstream jewellery_api { server api:3001; keepalive 32; }
  upstream jewellery_web { server web:3000; keepalive 32; }

  include /etc/nginx/conf.d/*.conf;
}
