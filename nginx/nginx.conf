worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API — api.storebuilder.jatsolutions.in
    server {
        listen 80;
        server_name api.storebuilder.jatsolutions.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name api.storebuilder.jatsolutions.in;

        ssl_certificate     /etc/letsencrypt/live/api.storebuilder.jatsolutions.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.storebuilder.jatsolutions.in/privkey.pem;

        location / {
            proxy_pass http://api:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Web — storebuilder.jatsolutions.in and *.storebuilder.jatsolutions.in
    server {
        listen 80;
        server_name storebuilder.jatsolutions.in *.storebuilder.jatsolutions.in;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name storebuilder.jatsolutions.in *.storebuilder.jatsolutions.in;

        ssl_certificate     /etc/letsencrypt/live/storebuilder.jatsolutions.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/storebuilder.jatsolutions.in/privkey.pem;

        location / {
            proxy_pass http://web:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
